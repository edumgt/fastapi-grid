<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastAPI + PostgreSQL + AG Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css" />
</head>

<body class="bg-slate-50 min-h-screen">
  <main class="max-w-6xl mx-auto p-6 space-y-4">
    <h1 class="text-2xl font-bold">FastAPI + Docker PostgreSQL + AG Grid</h1>

    <section id="loginView" class="bg-white p-4 rounded-xl shadow-sm border w-full md:w-96 space-y-3">
      <h2 class="font-semibold">로그인</h2>
      <input id="username" class="w-full border rounded px-3 py-2" value="admin" placeholder="아이디" />
      <input id="password" type="password" class="w-full border rounded px-3 py-2" value="admin1234" placeholder="비밀번호" />
      <button id="btnLogin" class="w-full bg-indigo-600 text-white rounded px-3 py-2">로그인</button>
      <p id="loginMsg" class="text-sm text-rose-600"></p>
    </section>

    <section id="appView" class="hidden space-y-3">
      <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-wrap gap-2 items-center">
        <span id="me" class="text-sm font-medium"></span>
        <input id="search" class="border rounded px-3 py-2 text-sm" placeholder="검색어" />
        <button id="btnSearch" class="px-3 py-2 rounded bg-slate-800 text-white text-sm">검색</button>
        <button id="btnNew" class="px-3 py-2 rounded bg-emerald-600 text-white text-sm">새 글</button>
        <button id="btnLogout" class="px-3 py-2 rounded bg-slate-200 text-sm">로그아웃</button>
      </div>

      <div id="grid" class="ag-theme-alpine w-full" style="height: 520px;"></div>
    </section>
  </main>

  <dialog id="editor" class="rounded-xl p-0 w-full max-w-xl">
    <form method="dialog" class="p-4 space-y-3">
      <h3 id="editorTitle" class="font-semibold">게시글</h3>
      <input id="postTitle" class="w-full border rounded px-3 py-2" placeholder="제목" />
      <textarea id="postContent" class="w-full border rounded px-3 py-2" rows="8" placeholder="내용"></textarea>
      <div class="flex justify-end gap-2">
        <button class="px-3 py-2 rounded bg-slate-200">취소</button>
        <button id="btnSave" value="default" class="px-3 py-2 rounded bg-indigo-600 text-white">저장</button>
      </div>
    </form>
  </dialog>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const $ = (id) => document.getElementById(id);
    const state = {
      token: localStorage.getItem("token") || "",
      editId: null,
      gridApi: null,
      query: "",
    };

    const columnDefs = [
      { field: "id", width: 90 },
      { field: "title", flex: 1 },
      { field: "owner", width: 130 },
      { field: "views", width: 100 },
      { field: "created_at", width: 200 },
      {
        headerName: "액션",
        width: 180,
        cellRenderer: (p) => {
          const wrap = document.createElement("div");
          wrap.className = "h-full flex items-center gap-1";

          const e = document.createElement("button");
          e.textContent = "수정";
          e.className = "text-xs px-2 py-1 rounded bg-amber-500 text-white";
          e.onclick = () => openEditor(p.data);

          const d = document.createElement("button");
          d.textContent = "삭제";
          d.className = "text-xs px-2 py-1 rounded bg-rose-600 text-white";
          d.onclick = () => removePost(p.data.id);

          wrap.append(e, d);
          return wrap;
        }
      }
    ];

    async function api(path, options = {}) {
      const headers = options.headers || {};
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      if (!(options.body instanceof FormData)) headers["Content-Type"] = "application/json";

      const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
      if (res.status === 401) {
        logout();
        throw new Error("로그인이 필요합니다.");
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "요청 실패");
      return data;
    }

    async function login() {
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ username: $("username").value, password: $("password").value })
        });
        state.token = data.access_token;
        localStorage.setItem("token", state.token);
        await loadMe();
        showApp();
        await loadPosts();
      } catch (e) {
        $("loginMsg").textContent = e.message;
      }
    }

    async function loadMe() {
      const me = await api("/api/auth/me");
      $("me").textContent = `로그인: ${me.username}`;
    }

    async function loadPosts() {
      const params = new URLSearchParams({ page: 1, size: 50 });
      if (state.query) params.set("q", state.query);
      const data = await api(`/api/posts?${params.toString()}`);
      state.gridApi.setGridOption("rowData", data.items);
    }

    function openEditor(row = null) {
      state.editId = row?.id || null;
      $("editorTitle").textContent = state.editId ? `게시글 수정 #${state.editId}` : "새 게시글";
      $("postTitle").value = row?.title || "";
      $("postContent").value = row?.content || "";
      $("editor").showModal();
    }

    async function savePost() {
      const payload = {
        title: $("postTitle").value.trim(),
        content: $("postContent").value.trim(),
      };
      if (!payload.title || !payload.content) return;

      if (state.editId) {
        await api(`/api/posts/${state.editId}`, { method: "PUT", body: JSON.stringify(payload) });
      } else {
        await api("/api/posts", { method: "POST", body: JSON.stringify(payload) });
      }
      $("editor").close();
      await loadPosts();
    }

    async function removePost(id) {
      if (!confirm("삭제하시겠습니까?")) return;
      await api(`/api/posts/${id}`, { method: "DELETE" });
      await loadPosts();
    }

    function showApp() {
      $("loginView").classList.add("hidden");
      $("appView").classList.remove("hidden");
    }

    function logout() {
      state.token = "";
      localStorage.removeItem("token");
      $("appView").classList.add("hidden");
      $("loginView").classList.remove("hidden");
    }

    function initGrid() {
      const gridOptions = {
        columnDefs,
        rowData: [],
        defaultColDef: { sortable: true, resizable: true },
      };
      state.gridApi = agGrid.createGrid($("grid"), gridOptions);
    }

    $("btnLogin").onclick = login;
    $("btnLogout").onclick = logout;
    $("btnNew").onclick = () => openEditor();
    $("btnSave").onclick = async (e) => { e.preventDefault(); await savePost(); };
    $("btnSearch").onclick = async () => { state.query = $("search").value.trim(); await loadPosts(); };

    initGrid();
    if (state.token) {
      loadMe().then(showApp).then(loadPosts).catch(logout);
    }
  </script>
</body>

</html>
